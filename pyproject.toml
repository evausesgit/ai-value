[project]
name = "ai-value"
version = "0.1.0"
description = "AI Value — suivi de l'adoption de l'IA dans les équipes : usages, connaissances, feedback"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# B008 : `Depends(...)`/`Query(...)` en valeur par défaut est l'idiome FastAPI.
# ISC004 : les textes longs des données de démo sont découpés sur plusieurs lignes.
extend-ignore = ["B008", "ISC004"]
